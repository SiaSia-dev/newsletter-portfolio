name: Publication Hebdomadaire sur LinkedIn

on:
  schedule:
    # Exécution tous les lundis à 9h00
    - cron: '0 9 * * 1'
  workflow_run:
    workflows: ["Génération et Déploiement de Newsletter"]
    types:
      - completed
  workflow_dispatch:  # Permet de lancer manuellement
    inputs:
      force_publish:
        description: 'Forcer la publication même si déjà publié cette semaine'
        required: false
        default: 'false'
        type: boolean
      skip_cache:
        description: 'Ignorer la vérification du cache pour les doublons'
        required: false
        default: 'false'
        type: boolean

# Ajout des permissions pour permettre l'écriture dans le dépôt
permissions:
  contents: write

jobs:
  publish-linkedin:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
              
      - name: Checkout newsletter repository
        uses: actions/checkout@v3
        with:
          repository: SiaSia-dev/newsletter-portfolio
          path: newsletter-portfolio
          token: ${{ secrets.DEPLOY_TOKEN }}
          ref: gh-pages
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Verify LinkedIn token
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          # Token validation
          echo "Vérification de la validité du token LinkedIn..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
             -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
             -H "X-Restli-Protocol-Version: 2.0.0" \
             "https://api.linkedin.com/v2/me")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Token LinkedIn valide"
          elif [ "$HTTP_STATUS" -eq 401 ]; then
            echo "❌ Token LinkedIn invalide ou expiré (HTTP 401)"
            echo "Veuillez régénérer votre token LinkedIn et mettre à jour le secret LINKEDIN_ACCESS_TOKEN"
            exit 1
          else
            echo "⚠️ Statut de vérification du token LinkedIn: $HTTP_STATUS"
            echo "Poursuite du workflow, mais soyez attentif aux erreurs potentielles"
          fi
      
      - name: Create LinkedIn cache directory
        run: |
          mkdir -p .linkedin_cache
          
      - name: Clean up existing lock file
        if: ${{ inputs.force_publish }}
        run: |
          rm -f .linkedin_cache/weekly_lock
          echo "🔄 Nettoyage du verrou hebdomadaire pour permettre une nouvelle publication"
          
      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          NEWSLETTERS_DIR: ${{ github.workspace }}/newsletter-portfolio
          GITHUB_USERNAME: SiaSia-dev
          GITHUB_REPO: newsletter-portfolio
          FORCE_LINKEDIN_PUBLISH: ${{ inputs.force_publish }}
          SKIP_LINKEDIN_CACHE: ${{ inputs.skip_cache }}
        run: |
          # Exécuter le script
          python scripts/linkedin_publisher.py
          
          if [ $? -ne 0 ]; then
            echo "❌ Échec de la publication LinkedIn"
            exit 1
          else
            echo "✅ Publication LinkedIn réussie"
          fi

      - name: Enregistrer la publication
        if: success()
        run: |
          echo "Publication sur LinkedIn effectuée le $(date)" >> publications_log.txt
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Action"
          git add publications_log.txt
          git commit -m "Enregistrement de la publication LinkedIn du $(date)"
          git push