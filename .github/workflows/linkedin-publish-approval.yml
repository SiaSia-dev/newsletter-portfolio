name: Publication LinkedIn avec Approbation

on:
  workflow_dispatch:
  issues:
    types: [labeled]

jobs:
  create-issue:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 python-dotenv
      
      - name: Extraire le contenu de la newsletter
        run: |
          cat > extract_content.py << 'EOF'
          import requests
          from bs4 import BeautifulSoup

          url = "https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html"
          
          try:
              response = requests.get(url, timeout=10)
              response.raise_for_status()
              
              soup = BeautifulSoup(response.content, 'html.parser')
              
              projects = []
              project_cards = soup.select('.project-card')
              
              for card in project_cards:
                  title_elem = card.select_one('.project-title a')
                  title = title_elem.get_text().strip() if title_elem else "Sans titre"
                  
                  link = title_elem.get('href') if title_elem else None
                  
                  desc_elem = card.select_one('.project-description')
                  description = desc_elem.get_text().strip() if desc_elem else ""
                  
                  if len(description) > 150:
                      description = description[:147] + "..."
                  
                  projects.append({
                      'title': title,
                      'link': link,
                      'description': description
                  })
              
              markdown = "## 📋 Contenu de la newsletter\n\n"
              
              for i, project in enumerate(projects, 1):
                  link = project['link'] if project['link'] else ""
                  markdown += f"### {i}. [{project['title']}](https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html{link})\n"
                  markdown += f"{project['description']}\n\n"
              
              print(markdown)
              
          except Exception as e:
              print("## ❌ Erreur lors de la récupération")
              print(f"Erreur: {e}")
          EOF
          
          NEWSLETTER_CONTENT=$(python extract_content.py)
          
          mkdir -p .github
          cat > .github/newsletter-notification.md << 'EOF'
          ---
          title: "🔔 Newsletter Portfolio générée - À vérifier"
          labels: notification
          assignees: SiaSia-dev
          ---

          # 📰 Newsletter Portfolio - 23/05/2025

          La newsletter de cette semaine a été générée et est prête pour votre validation.

          ## 🔗 Liens principaux
          - [Version complète de la newsletter](https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html)

          $NEWSLETTER_CONTENT

          ---

          ### ✅ Actions requises
          - **Pour publier sur LinkedIn : ajoutez le label `approved` à cette issue**
          EOF

      - name: Créer une issue de notification
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          filename: .github/newsletter-notification.md

  publish-linkedin:
    if: github.event_name == 'issues' && github.event.label.name == 'approved' && contains(github.event.issue.title, 'Newsletter Portfolio')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
      
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests bs4 python-dotenv
      
    - name: Publication du lien sur LinkedIn
      run: |
        mkdir -p .linkedin_cache
        python scripts/linkedin-publisher-newsletter.py
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        GB_USERNAME: ${{ secrets.GB_USERNAME }}
        GB_REPO: ${{ secrets.GB_REPO }}
        FORCE_LINKEDIN_PUBLISH: 'true'
    
    - name: Commenter l'issue
      uses: peter-evans/create-or-update-comment@v2
      with:
        issue-number: ${{ github.event.issue.number }}
        body: |
          ✅ Publication LinkedIn effectuée avec succès !
          
          La newsletter a été publiée sur LinkedIn avec le lien vers https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html
    
    - name: Fermer l'issue
      uses: peter-evans/close-issue@v3
      with:
        issue-number: ${{ github.event.issue.number }}