name: Publication sur LinkedIn 

on:
  workflow_dispatch:  # Déclenchement manuel pour créer l'issue
  repository_dispatch:  # Déclenché depuis l'autre repository
    types: [newsletter-generated]
  schedule:
    - cron: '*/30 * * * *'  # Vérification toutes les 30 minutes
  issues:
    types: [labeled]  # Déclenché lorsqu'un label est ajouté à une issue

jobs:
  check-new-newsletter:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier s'il y a une nouvelle newsletter
        id: check-newsletter
        run: |
          # Récupérer la date de la dernière newsletter publiée
          NEWSLETTER_URL="https://siasia-dev.github.io/portfolio-newsletter/latest.html"
          
          # Créer un fichier de cache pour stocker la dernière vérification
          CACHE_FILE=".newsletter_cache"
          CURRENT_TIME=$(date +%s)
          
          # Vérifier si la newsletter existe et récupérer ses métadonnées
          RESPONSE=$(curl -s -I "$NEWSLETTER_URL" | grep -i "last-modified" | cut -d' ' -f2-)
          
          if [ ! -f "$CACHE_FILE" ]; then
            echo "Première vérification, création du cache"
            echo "$CURRENT_TIME" > "$CACHE_FILE"
            echo "NEW_NEWSLETTER=true" >> $GITHUB_ENV
          else
            LAST_CHECK=$(cat "$CACHE_FILE")
            # Si plus de 24h depuis la dernière vérification, considérer comme nouvelle
            if [ $((CURRENT_TIME - LAST_CHECK)) -gt 86400 ]; then
              echo "Nouvelle newsletter détectée"
              echo "$CURRENT_TIME" > "$CACHE_FILE"
              echo "NEW_NEWSLETTER=true" >> $GITHUB_ENV
            else
              echo "Pas de nouvelle newsletter"
              echo "NEW_NEWSLETTER=false" >> $GITHUB_ENV
            fi
          fi
      
      - name: Déclencher création d'issue si nouvelle newsletter
        if: env.NEW_NEWSLETTER == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: newsletter-found

  create-issue:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 python-dotenv
      
      - name: Extraire le contenu de la newsletter pour la publication
        run: |
          cat > extract_content.py << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://siasia-dev.github.io/portfolio-newsletter/latest.html"
          
          try:
              response = requests.get(url, timeout=10)
              response.raise_for_status()
              
              soup = BeautifulSoup(response.content, 'html.parser')
              text_content = soup.get_text()
              
              # Extraire les sections principales (simulé)
              sections = [
                  "LLM function calls don't scale; code orchestration is simpler, more effective de Jiquan Ngiam",
                  "MCP = Méta-API ?", 
                  "L'information obligée d'être créative",
                  "Implémentation de la stratégie COPE (Create Once, Publish Everywhere)",
                  "Architecture Modulaire à Base de Contenu",
                  "Méréologie comme cadre d'analyse"
              ]
              
              markdown = ""
              for i, section in enumerate(sections, 1):
                  if "LLM function" in section:
                      desc = "Retour d'expérience et proposition pour l'orchestration MCP"
                  elif "MCP" in section:
                      desc = "MCP est un orchestrateur d'API"
                  elif "information" in section:
                      desc = "La segmentation du web conduit à de nouvelles formes de régulation de l'information"
                  elif "COPE" in section:
                      desc = "Mise en place d'un système \"Create Once, Publish Everywhere\" qui part des fichiers Markdown pour générer automatiquement un portfolio et une newsle..."
                  elif "Architecture" in section:
                      desc = "L'**Architecture Modulaire à Base de Contenu** (ou \"Content-Driven Modular Architecture\")"
                  else:
                      desc = "La méréologie comme cadre d'analyse: de la logique formelle aux archives visuelles"
                  
                  markdown += f"**{i}. {section}**\n{desc}\n\n"
              
              print(markdown)
              
          except Exception as e:
              print("Newsletter générée avec succès - Contenu disponible en ligne")
          EOF
          
          NEWSLETTER_CONTENT=$(python extract_content.py)
          
          # Utiliser newsletter-publication.md
          cat > .github/newsletter-publication.md << EOF
          ---
          title: "🔔 Newsletter du  $(date +"%d/%m/%Y") - À vérifier"
          labels: notification
          assignees: SiaSia-dev
          ---

          # 📰 Newsletter Portfolio - $(date +"%d/%m/%Y")

          La newsletter de cette semaine est arrivée !

          ## 🔗 Liens principaux
          - [Version complète de la newsletter](https://siasia-dev.github.io/portfolio-newsletter/latest.html)
          - [Archives des newsletters](https://siasia-dev.github.io/portfolio-newsletter/archives.html)

          ## 📋 Contenu de la newsletter

          $NEWSLETTER_CONTENT

          ---

          ### ✅ Actions requises
          4. **Pour approuver et publier sur LinkedIn** : Ajoutez le label \`approved\` à cette issue
          EOF

      - name: Vérification finale et rapport
        run: |
          echo "🎉 Issue de validation créée avec succès !"
          echo "URL de la newsletter : https://siasia-dev.github.io/portfolio-newsletter/latest.html"

      - name: Créer une issue de notification
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          filename: .github/newsletter-publication.md
          update_existing: true
          search_existing: "Newsletter Portfolio générée - À vérifier"

  approval-check:
    if: ${{ github.event_name == 'issues' && github.event.label.name == 'approved' }}
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier si l'issue est une notification de newsletter
        id: check-issue
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          if [[ $ISSUE_TITLE == *"Newsletter Portfolio générée"* ]]; then
            echo "C'est une issue de notification de newsletter."
            echo "APPROVED=true" >> $GITHUB_ENV
          else
            echo "Ce n'est pas une issue de notification de newsletter."
            echo "APPROVED=false" >> $GITHUB_ENV
          fi

      - name: Vérifier si l'issue est approuvée
        if: env.APPROVED == 'true'
        run: echo "L'issue de notification de newsletter a été approuvée. Préparation de la publication LinkedIn..."

  publish-linkedin:
    needs: approval-check
    if: ${{ github.event_name == 'issues' && github.event.label.name == 'approved' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
      
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests bs4 python-dotenv
      
    - name: Publication du lien sur LinkedIn
      run: |
        # Créer le dossier .linkedin_cache si nécessaire
        mkdir -p .linkedin_cache
        
        # Exécuter le script de publication
        python scripts/linkedin-publisher-newsletter.py
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        LINKEDIN_COMPANY_ID: ${{ secrets.LINKEDIN_ORG_ID }}
        #GB_USERNAME: ${{ secrets.GB_USERNAME }}
        #GB_REPO: ${{ secrets.GB_REPO }}
        #FORCE_LINKEDIN_PUBLISH: 'true'  # Force la publication même si déjà publié cette semaine
        #SKIP_LINKEDIN_CACHE: 'true'
    
    - name: Commenter l'issue
      uses: peter-evans/create-or-update-comment@v2
      with:
        issue-number: ${{ github.event.issue.number }}
        body: |
          ✅ Publication LinkedIn effectuée avec succès !
          
          La newsletter a été publiée sur LinkedIn avec le lien vers https://siasia-dev.github.io/portfolio-newsletter/latest.html
          
          Date de publication : ${{ format(github.event.issue.updated_at, 'DD/MM/YYYY à HH:mm') }}
    
    - name: Fermer l'issue
      uses: peter-evans/close-issue@v3
      with:
        issue-number: ${{ github.event.issue.number }}
        comment: false  # Pas de commentaire supplémentaire, nous avons déjà commenté ci-dessus