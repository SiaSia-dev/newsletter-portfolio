name: Publication LinkedIn avec Approbation

on:
  workflow_dispatch:
  issues:
    types: [labeled]

jobs:
  create-issue:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 python-dotenv
      
      - name: Extraire le contenu de la newsletter
        run: |
          cat > extract_content.py << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import re

          url = "https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html"
          
          try:
              response = requests.get(url, timeout=10)
              response.raise_for_status()
              
              soup = BeautifulSoup(response.content, 'html.parser')
              
              # Récupérer tout le texte de la newsletter
              content = soup.get_text()
              
              # Extraire les articles/sections principales
              sections = []
              
              # Chercher les liens vers des articles
              links = soup.find_all('a', href=True)
              for link in links:
                  if 'http' in link.get('href', ''):
                      title = link.get_text().strip()
                      if len(title) > 20:  # Ignorer les liens courts
                          sections.append({
                              'title': title[:100] + '...' if len(title) > 100 else title,
                              'url': link.get('href')
                          })
              
              # Si pas de liens, extraire les premiers paragraphes
              if not sections:
                  paragraphs = content.split('\n')
                  for i, para in enumerate(paragraphs[:5]):
                      if len(para.strip()) > 50:
                          sections.append({
                              'title': f"Section {i+1}",
                              'content': para.strip()[:200] + '...' if len(para.strip()) > 200 else para.strip()
                          })
              
              # Créer le résumé
              markdown = "## 📋 Contenu de la newsletter\n\n"
              markdown += f"**Thèmes principaux :** MCP, Architecture modulaire, Méréologie\n\n"
              
              if sections:
                  for i, section in enumerate(sections[:3], 1):
                      if 'url' in section:
                          markdown += f"### {i}. [{section['title']}]({section['url']})\n\n"
                      else:
                          markdown += f"### {i}. {section['title']}\n"
                          markdown += f"{section['content']}\n\n"
              else:
                  markdown += "Articles sur l'orchestration IA, l'innovation locale et les méthodes d'analyse.\n\n"
              
              print(markdown)
              
          except Exception as e:
              print("## 📋 Contenu de la newsletter\n\n")
              print("**Newsletter générée avec succès !**\n")
              print("Articles sur MCP, architecture modulaire et méréologie.\n")
              print(f"\n*(Erreur d'extraction automatique: {e})*")
          EOF
          
          NEWSLETTER_CONTENT=$(python extract_content.py)
          
          mkdir -p .github
          cat > .github/newsletter-notification.md << 'EOF'
          ---
          title: "🔔 Newsletter Portfolio générée - À vérifier"
          labels: notification
          assignees: SiaSia-dev
          ---

          # 📰 Newsletter Portfolio - 23/05/2025

          La newsletter de cette semaine a été générée et est prête pour votre validation.

          ## 🔗 Liens principaux
          - [Version complète de la newsletter](https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html)

          $NEWSLETTER_CONTENT

          ---

          ### ✅ Actions requises
          - **Pour publier sur LinkedIn : ajoutez le label `approved` à cette issue**
          EOF

      - name: Créer une issue de notification
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          filename: .github/newsletter-notification.md

  publish-linkedin:
    if: github.event_name == 'issues' && github.event.label.name == 'approved' && contains(github.event.issue.title, 'Newsletter Portfolio')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
      
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests bs4 python-dotenv
      
    - name: Publication du lien sur LinkedIn
      run: |
        mkdir -p .linkedin_cache
        python scripts/linkedin-publisher-newsletter.py
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        GB_USERNAME: ${{ secrets.GB_USERNAME }}
        GB_REPO: ${{ secrets.GB_REPO }}
        FORCE_LINKEDIN_PUBLISH: 'true'
    
    - name: Commenter l'issue
      uses: peter-evans/create-or-update-comment@v2
      with:
        issue-number: ${{ github.event.issue.number }}
        body: |
          ✅ Publication LinkedIn effectuée avec succès !
          
          La newsletter a été publiée sur LinkedIn avec le lien vers https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html
    
    - name: Fermer l'issue
      uses: peter-evans/close-issue@v3
      with:
        issue-number: ${{ github.event.issue.number }}