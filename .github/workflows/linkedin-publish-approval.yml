name: Publication LinkedIn avec Approbation

on:
  workflow_dispatch:
  issues:
    types: [labeled]

jobs:
  publish-linkedin:
    if: github.event_name == 'issues' && github.event.label.name == 'approved' && contains(github.event.issue.title, 'Newsletter Portfolio')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
      
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests bs4 python-dotenv
      
    - name: Publication du lien sur LinkedIn
      run: |
        mkdir -p .linkedin_cache
        python scripts/linkedin-publisher-newsletter.py
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        GB_USERNAME: ${{ secrets.GB_USERNAME }}
        GB_REPO: ${{ secrets.GB_REPO }}
        FORCE_LINKEDIN_PUBLISH: 'true'
    
    - name: Commenter l'issue
      uses: peter-evans/create-or-update-comment@v2
      with:
        issue-number: ${{ github.event.issue.number }}
        body: |
          ✅ Publication LinkedIn effectuée avec succès !
          
          La newsletter a été publiée sur LinkedIn avec le lien vers https://siasia-dev.github.io/portfolio-newsletter/newsletter_20250523.html
    
    - name: Fermer l'issue
      uses: peter-evans/close-issue@v3
      with:
        issue-number: ${{ github.event.issue.number }}